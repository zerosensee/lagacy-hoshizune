services:
  postgres:
    image: postgres:16-alpine
    container_name: hoshizune-postgres-full
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hoshizune
    ports:
      - "5432:5432"
    volumes:
      - postgres_full_data:/var/lib/postgresql/data
    networks:
      - hoshizune-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoshizune-bot-full
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hoshizune
    networks:
      - hoshizune-net

networks:
  hoshizune-net:
    driver: bridge

volumes:
  postgres_full_data:
