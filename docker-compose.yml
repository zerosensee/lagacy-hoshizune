services:
  postgres:
    image: postgres:16-alpine
    container_name: hoshizune-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hoshizune
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoshizune"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hoshizune-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: hoshizune-bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hoshizune
    networks:
      - hoshizune-net

networks:
  hoshizune-net:
    driver: bridge

volumes:
  postgres_data:
